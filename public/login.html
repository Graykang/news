<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>로그인 · 뉴스 모아보기</title>
<style>
  :root { --bg:#f6f6f4; --card:#fff; --ink:#16181d; --ink3:#8a90a0; --line:#e6e6e1; --accent:#1d4ed8; --err:#b91c1c; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111317; --card:#1a1d23; --ink:#eceef2; --ink3:#737a89; --line:#2a2e37; --accent:#7aa2ff; --err:#ff8a8a; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink);
         font:16px/1.5 'Pretendard Variable',Pretendard,'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif; }
  form { width:min(360px,calc(100vw - 32px)); background:var(--card); border:1px solid var(--line); border-radius:16px; padding:28px 24px; }
  h1 { margin:0 0 4px; font-size:22px; font-weight:800; letter-spacing:-.03em; }
  p { margin:0 0 20px; color:var(--ink3); font-size:14px; }
  label { display:block; font-size:13px; font-weight:600; margin:12px 0 6px; }
  input { width:100%; height:44px; padding:0 12px; border:1px solid var(--line); border-radius:10px; background:transparent; color:var(--ink); font:inherit; outline:none; }
  input:focus { border-color:var(--accent); }
  button { width:100%; height:46px; margin-top:20px; border:0; border-radius:10px; background:var(--accent); color:#fff; font:inherit; font-weight:700; cursor:pointer; }
  button:disabled { opacity:.6; cursor:default; }
  .err { min-height:20px; margin-top:12px; font-size:13px; color:var(--err); }
</style>
</head>
<body>
<form id="f" autocomplete="on">
  <h1>뉴스 모아보기</h1>
  <p>가족 전용 페이지입니다. 발급받은 계정으로 로그인해 주세요.</p>
  <label for="u">아이디</label>
  <input id="u" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" required autofocus>
  <label for="p">비밀번호</label>
  <input id="p" name="password" type="password" autocomplete="current-password" required>
  <button id="b" type="submit">로그인</button>
  <div class="err" id="e" role="alert"></div>
</form>
<script>
  const f = document.getElementById('f'), e = document.getElementById('e'), b = document.getElementById('b');
  f.addEventListener('submit', async (ev) => {
    ev.preventDefault(); e.textContent = ''; b.disabled = true;
    try {
      const r = await fetch('/login', { method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ username: f.username.value, password: f.password.value }) });
      const j = await r.json().catch(() => ({}));
      if (r.ok) { location.replace('/'); return; }
      e.textContent = j.error || '로그인에 실패했습니다.';
    } catch { e.textContent = '서버에 연결할 수 없습니다.'; }
    b.disabled = false; f.password.select();
  });
</script>
</body>
</html>
