<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>로그인 · Kangs News</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; display: grid; place-items: center; color: #fff;
    font: 16px/1.5 'Pretendard Variable', Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', system-ui, sans-serif;
    /* 사진이 불러와지지 않아도 어울리는 초록빛 배경이 보이도록 아래에 그라데이션을 깔아 둠 */
    background-color: #36584c;
    background-image:
      linear-gradient(180deg, rgba(0,0,0,.05), rgba(6,24,16,.28)),
      url('https://images.unsplash.com/photo-1756136640168-121678eb6cd0?auto=format&fit=crop&w=1800&q=72'),
      linear-gradient(160deg, #5f8576, #2b4a3f);
    background-size: cover; background-position: center; background-attachment: fixed;
  }
  @media (max-width: 700px) {
    body { background-image: linear-gradient(180deg, rgba(0,0,0,.05), rgba(6,24,16,.28)), url('https://images.unsplash.com/photo-1756136640168-121678eb6cd0?auto=format&fit=crop&w=1000&q=70'), linear-gradient(160deg, #5f8576, #2b4a3f); }
  }
  form {
    width: min(380px, calc(100vw - 32px)); text-align: center; padding: 36px 30px 30px; border-radius: 22px;
    background: rgba(14, 34, 28, .38); border: 1px solid rgba(255,255,255,.34);
    backdrop-filter: blur(14px) saturate(1.1); -webkit-backdrop-filter: blur(14px) saturate(1.1);
    box-shadow: 0 20px 60px rgba(8, 24, 18, .35);
  }
  h1 { margin: 0; font-size: 32px; font-weight: 800; letter-spacing: -.02em; color: #ffd166; text-shadow: 0 2px 12px rgba(60,30,0,.55); } /* 앰버 골드 */
  p.sub { margin: 8px 0 24px; font-size: 14px; color: rgba(255,255,255,.92); text-shadow: 0 1px 6px rgba(0,0,0,.4); }
  label.f { display: block; text-align: left; font-size: 12.5px; font-weight: 600; margin: 12px 0 6px; }
  input[type=text], input[type=password] {
    width: 100%; height: 46px; padding: 0 14px; font: inherit; outline: none; border-radius: 12px;
    border: 1px solid rgba(255,255,255,.42); background: rgba(255,255,255,.16); color: #fff;
  }
  input::placeholder { color: rgba(255,255,255,.7); }
  input[type=text]:focus, input[type=password]:focus { border-color: #fff; background: rgba(255,255,255,.26); }
  .keep { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 16px; font-size: 13.5px; cursor: pointer; user-select: none; text-shadow: 0 1px 6px rgba(0,0,0,.4); }
  .keep input { width: 17px; height: 17px; accent-color: #fff; cursor: pointer; }
  .hint { margin: 5px 0 0; text-align: center; font-size: 12px; color: rgba(255,255,255,.85); text-shadow: 0 1px 6px rgba(0,0,0,.4); }
  .hint.warn { margin-top: 3px; font-size: 12.5px; font-weight: 700; color: #ffe39a; }
  button {
    width: 100%; height: 48px; margin-top: 18px; border: 0; border-radius: 12px; cursor: pointer;
    background: #fff; color: #12382b; font: inherit; font-weight: 700;
  }
  button:disabled { opacity: .65; cursor: default; }
  .err { min-height: 20px; margin-top: 12px; font-size: 13px; font-weight: 600; color: #ffd0d0; text-shadow: 0 1px 6px rgba(0,0,0,.5); }
  .credit { position: fixed; right: 12px; bottom: 8px; font-size: 11px; color: rgba(255,255,255,.7); text-shadow: 0 1px 2px rgba(0,0,0,.5); }
</style>
</head>
<body>
<form id="f" autocomplete="on">
  <h1>Kangs News</h1>
  <p class="sub">발급된 계정으로만 로그인 가능합니다.</p>
  <label class="f" for="u">아이디</label>
  <input id="u" name="username" type="text" placeholder="아이디" autocomplete="username" autocapitalize="none" autocorrect="off" required autofocus>
  <label class="f" for="p">비밀번호</label>
  <input id="p" name="password" type="password" placeholder="비밀번호" autocomplete="current-password" required>
  <label class="keep"><input id="k" type="checkbox" checked> 로그인 상태 유지 (30일)</label>
  <p class="hint">접속할 때마다 유지 기간이 30일로 연장됩니다.</p>
  <p class="hint warn">반드시 공용 PC에서는 체크를 해제하세요!!</p>
  <button id="b" type="submit">로그인</button>
  <div class="err" id="e" role="alert"></div>
</form>
<span class="credit">Photo: Unsplash</span>
<script>
  const f = document.getElementById('f'), e = document.getElementById('e'), b = document.getElementById('b');
  f.addEventListener('submit', async (ev) => {
    ev.preventDefault(); e.textContent = ''; b.disabled = true;
    try {
      const r = await fetch('/login', { method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ username: f.username.value, password: f.password.value, remember: document.getElementById('k').checked }) });
      const j = await r.json().catch(() => ({}));
      if (r.ok) { location.replace('/'); return; }
      e.textContent = j.error || '로그인에 실패했습니다.';
    } catch { e.textContent = '서버에 연결할 수 없습니다.'; }
    b.disabled = false; f.password.select();
  });
</script>
</body>
</html>
