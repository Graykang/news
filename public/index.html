<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>뉴스 모아보기</title>
<meta name="description" content="광고 없이 헤드라인 뉴스와 사설만 모아보는 뉴스 리더">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow,noarchive">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231d4ed8'/%3E%3Cpath d='M8 10h16M8 16h16M8 22h10' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<script>
  // 하루 첫 접속 때만 시작 화면을 켬(깜빡임 없이 바로 덮기 위해 가장 먼저 판단). 각자 '내 설정'에서 끌 수 있음
  try {
    var d = new Date(), k = d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
    var off = localStorage.getItem('splashOff') === '1', just = sessionStorage.getItem('justLoggedIn') === '1';
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches && !off && (just || localStorage.getItem('splashDay') !== k)) document.documentElement.classList.add('splash-on');
  } catch (e) {}
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="splash" aria-hidden="true">
  <div class="sp-card">
    <h1 class="sp-title">Kangs News</h1>
    <p class="sp-hello" id="spHello"></p>
    <p class="sp-msg" id="spMsg"></p>
    <p class="sp-motto" id="spMotto"></p>
    <p class="sp-auto" id="spAuto">자동 로그인 중…</p>
  </div>
</div>

<dialog id="prof" class="prof">
  <h3>내 설정</h3>
  <label class="pf"><input type="checkbox" id="pfSplash"> 하루 첫 접속 때 시작 화면 보기</label>
  <label class="pf2" for="pfMotto">나의 문구 (좌우명·슬로건, 최대 60자)</label>
  <input id="pfMotto" maxlength="60" placeholder="시작 화면에 내 이름과 함께 보일 문구" autocomplete="off">
  <p class="pfhint" id="pfWelcome"></p>
  <div class="pfbtns"><button id="pfSave" type="button">저장</button><button id="pfClose" type="button" class="ghost">닫기</button></div>
  <p class="pfmsg" id="pfMsg" role="status"></p>
</dialog>

<header class="top">
  <div class="ticker" id="ticker" hidden aria-label="환율·지수 시세"><div class="ticker-track" id="tickerTrack"></div></div>
  <div class="wrap top-row">
    <div class="brand">
      <h1>뉴스 모아보기</h1>
      <span class="date" id="today"></span>
    </div>
    <div class="tools">
      <span class="updated" id="updated"></span>
      <button class="who" id="settings" title="내 설정">설정</button>
      <a class="who" id="adminlink" href="/admin" hidden>관리</a>
      <button class="who" id="logout" title="로그아웃"><span id="whoname"></span> 로그아웃</button>
      <button class="icon-btn" id="refresh" title="지금 새로고침" aria-label="새로고침">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
      </button>
      <button class="icon-btn" id="theme" title="밝게/어둡게" aria-label="테마 전환">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </div>
  <nav class="wrap tabs" id="tabs" aria-label="분류"></nav>
</header>

<main class="wrap">
  <div class="filters">
    <input id="q" type="search" placeholder="제목·내용 검색" autocomplete="off">
    <div class="chips" id="outlets" aria-label="매체 선택"></div>
  </div>
  <div class="sortbar" id="sortbar"><button class="seg" data-sort="latest">최신순</button><button class="seg" data-sort="hot">많이 다룬 순</button><span class="sorthint" id="sorthint"></span></div>
  <div class="newbar" id="newbar" hidden></div>
  <div class="kwbox" id="kwbox" hidden>
    <div class="kwrow">
      <b>찾을 키워드</b>
      <div class="kwchips" id="kwinc"></div>
      <form class="kwform" data-type="include"><input placeholder="예: 금리, 삼성전자 (쉼표로 여러 개)" maxlength="120" autocomplete="off"><button type="submit">추가</button></form>
    </div>
    <div class="kwrow">
      <b>제외할 단어</b>
      <div class="kwchips" id="kwexc"></div>
      <form class="kwform" data-type="exclude"><input placeholder="이 단어가 들어간 기사는 숨김 (예: 광고, 이벤트)" maxlength="120" autocomplete="off"><button type="submit">추가</button></form>
    </div>
  </div>
  <p class="desc" id="desc"></p>
  <div id="feed" aria-live="polite"></div>
  <button class="more" id="more" hidden>더 보기</button>
  <p class="empty" id="empty" hidden></p>
  <footer class="foot" id="foot">
    기사 제목·요약은 각 언론사가 공개한 RSS에서 가져오며, 전문은 제목을 누르면 원문 페이지에서 볼 수 있습니다.
    <span id="feedwarn"></span>
  </footer>
</main>
<script src="app.js"></script>
</body>
</html>
