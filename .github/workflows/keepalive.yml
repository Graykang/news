name: 자동 수집 유지 (60일 비활성 방지)

# GitHub는 공개 저장소에 60일간 활동이 없으면 예약 실행(자동 수집)을 꺼 버립니다.
# 한 달에 두 번 저장소에 빈 커밋을 남기고 수집 워크플로를 다시 켜서 그 타이머를 초기화합니다.
on:
  schedule:
    - cron: '0 3 1,15 * *'
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: 수집 워크플로 다시 켜기 (이미 켜져 있어도 무방)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/collect.yml/enable"
      - name: 빈 커밋으로 저장소 활동 남기기
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keepalive $(date -u +%Y-%m-%d)"
          git push
